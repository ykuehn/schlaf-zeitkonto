<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schlaf-Zeitkonto</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f2f0eb;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.20);
  --text: #1a1916;
  --muted: #6b6860;
  --hint: #b0aca4;
  --accent: #1a1916;
  --pos: #1a6b3c;
  --pos-bg: #e2f4eb;
  --neg: #982828;
  --neg-bg: #faeaea;
  --neu-bg: #ebebeb;
  --neu: #666;
  --radius: 10px;
  --radius-lg: 14px;
}

body {
  font-family: -apple-system, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2rem 1.25rem 4rem;
}

.container {
  max-width: 680px;
  margin: 0 auto;
}

header {
  margin-bottom: 2rem;
}

h1 {
  font-family: Arial, sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}

.subtitle {
  font-size: 13px;
  color: var(--muted);
}

/* Kontostand Card */
.konto-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.2rem 1.25rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.konto-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 600;
}

.konto-value {
  font-family: Arial, sans-serif;
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}

.konto-value.pos { color: var(--pos); }
.konto-value.neg { color: var(--neg); }

/* Form */
.form-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.1rem 1.25rem 1rem;
  margin-bottom: 1rem;
}

.soll-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 1rem;
  padding-bottom: 1rem;
  border-bottom: 0.5px solid var(--border);
}

.soll-row label {
  font-size: 13px;
  color: var(--muted);
}

.form-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-wrap: wrap;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  min-width: 100px;
}

.field label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

input[type="date"],
input[type="text"] {
  font-family: -apple-system, Arial, sans-serif;
  font-size: 16px;
  height: 42px;
  padding: 0 11px;
  background: var(--surface2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  width: 100%;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

input:focus {
  border-color: var(--border2);
  background: var(--surface);
}

.add-btn {
  height: 42px;
  padding: 0 1.25rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.add-btn:active { opacity: 0.75; }

.error {
  font-size: 12px;
  color: var(--neg);
  margin-top: 8px;
  display: none;
}

/* Table */
.table-wrap {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

col.c-datum  { width: 38%; }
col.c-ist    { width: 25%; }
col.c-delta  { width: 28%; }
col.c-del    { width: 9%; }

th {
  text-align: left;
  padding: 8px 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  background: var(--surface2);
  border-bottom: 0.5px solid var(--border);
}

td {
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--border);
  color: var(--text);
  font-size: 13px;
  vertical-align: middle;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.badge.pos { background: var(--pos-bg); color: var(--pos); }
.badge.neg { background: var(--neg-bg); color: var(--neg); }
.badge.neu { background: var(--neu-bg); color: var(--neu); }

.del-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--hint);
  font-size: 15px;
  padding: 4px;
  line-height: 1;
  display: block;
  margin: 0 auto;
}

.del-btn:active { color: var(--neg); }

.empty {
  text-align: center;
  padding: 2.5rem 1rem;
  color: var(--hint);
  font-size: 13px;
}
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Schlaf-Zeitkonto</h1>
    <span class="subtitle">Deine Schlafdauer im Überblick</span>
  </header>

  <div class="konto-card">
    <span class="konto-label">Kontostand</span>
    <span class="konto-value" id="sum-konto">—</span>
  </div>

  <div class="form-card">
    <div class="soll-row">
      <label>Tages-Soll:</label>
      <input type="text" id="soll-input" value="8:00" maxlength="5" style="width:68px; flex-shrink:0;">
      <span style="font-size:13px; color:var(--muted);">h:mm</span>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Datum</label>
        <input type="date" id="date-input">
      </div>
      <div class="field" style="max-width:140px;">
        <label>Geschlafen</label>
        <input type="text" id="ist-input" placeholder="8:15">
      </div>
      <button class="add-btn" onclick="addEntry()">Eintragen</button>
    </div>
    <p class="error" id="form-error"></p>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="c-datum">
        <col class="c-ist">
        <col class="c-delta">
        <col class="c-del">
      </colgroup>
      <thead>
        <tr>
          <th>Datum</th>
          <th>Ist</th>
          <th>Tag +/−</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="entries-body">
        <tr><td colspan="4" class="empty">Noch keine Einträge — fang heute an.</td></tr>
      </tbody>
    </table>
  </div>

</div>
<script>
let entries = [];
let defaultSoll = 8;

function parseHMM(val) {
  val = (val || '').trim().replace(',', ':').replace('.', ':');
  if (!val) return NaN;
  if (val.includes(':')) {
    const parts = val.split(':');
    const h = parseInt(parts[0], 10);
    const m = parseInt(parts[1] || '0', 10);
    if (isNaN(h) || isNaN(m) || m < 0 || m > 59) return NaN;
    return h + m / 60;
  }
  const h = parseFloat(val);
  return isNaN(h) ? NaN : h;
}

function toHMM(h) {
  const hh = Math.floor(Math.abs(h));
  const mm = Math.round((Math.abs(h) - hh) * 60);
  return hh + ':' + String(mm).padStart(2, '0');
}

function fmtH(h) {
  const sign = h < 0 ? '-' : '';
  const abs = Math.abs(h);
  const hh = Math.floor(abs);
  const mm = Math.round((abs - hh) * 60);
  return sign + hh + 'h ' + String(mm).padStart(2, '0') + 'm';
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  return day + '.' + m + '.' + y;
}

function save() {
  try {
    localStorage.setItem('sk_entries', JSON.stringify(entries));
    localStorage.setItem('sk_soll', String(defaultSoll));
  } catch(e) {}
}

function load() {
  try {
    const e = localStorage.getItem('sk_entries');
    if (e) entries = JSON.parse(e);
    const s = localStorage.getItem('sk_soll');
    if (s) {
      defaultSoll = parseFloat(s);
      document.getElementById('soll-input').value = toHMM(defaultSoll);
    }
  } catch(e) {}
}

document.getElementById('soll-input').addEventListener('change', function() {
  const parsed = parseHMM(this.value);
  if (!isNaN(parsed) && parsed > 0) {
    defaultSoll = parsed;
    this.value = toHMM(defaultSoll);
  } else {
    this.value = toHMM(defaultSoll);
  }
  save();
  render();
});

function addEntry() {
  const dateVal = document.getElementById('date-input').value;
  const istVal = parseHMM(document.getElementById('ist-input').value);
  const err = document.getElementById('form-error');

  if (!dateVal) { err.textContent = 'Bitte Datum angeben.'; err.style.display = 'block'; return; }
  if (isNaN(istVal) || istVal < 0 || istVal > 24) { err.textContent = 'Bitte im Format h:mm eingeben, z.B. 8:15.'; err.style.display = 'block'; return; }
  err.style.display = 'none';

  const idx = entries.findIndex(e => e.date === dateVal);
  const entry = { date: dateVal, ist: istVal, soll: defaultSoll };
  if (idx >= 0) entries[idx] = entry;
  else entries.push(entry);

  entries.sort((a, b) => a.date.localeCompare(b.date));
  document.getElementById('ist-input').value = '';
  save();
  render();
}

function deleteEntry(date) {
  if (!confirm('Eintrag für ' + fmtDate(date) + ' löschen?')) return;
  entries = entries.filter(e => e.date !== date);
  save();
  render();
}

function render() {
  const body = document.getElementById('entries-body');
  const kontoEl = document.getElementById('sum-konto');

  if (entries.length === 0) {
    body.innerHTML = '<tr><td colspan="4" class="empty">Noch keine Einträge — fang heute an.</td></tr>';
    kontoEl.textContent = '—';
    kontoEl.className = 'konto-value';
    return;
  }

  let html = '';
  let totalSoll = 0, totalIst = 0;

  entries.forEach(e => {
    const diff = e.ist - e.soll;
    totalSoll += e.soll;
    totalIst += e.ist;
    const dc = diff > 0.005 ? 'pos' : diff < -0.005 ? 'neg' : 'neu';
    const ds = diff > 0 ? '+' : '';
    html += `<tr>
      <td>${fmtDate(e.date)}</td>
      <td>${fmtH(e.ist)}</td>
      <td><span class="badge ${dc}">${ds}${fmtH(diff)}</span></td>
      <td><button class="del-btn" onclick="deleteEntry('${e.date}')">✕</button></td>
    </tr>`;
  });

  body.innerHTML = html;
  const k = totalIst - totalSoll;
  kontoEl.textContent = (k > 0 ? '+' : '') + fmtH(k);
  kontoEl.className = 'konto-value' + (k > 0.005 ? ' pos' : k < -0.005 ? ' neg' : '');
}

load();
document.getElementById('date-input').value = new Date().toISOString().slice(0, 10);
render();
</script>
</body>
</html>
